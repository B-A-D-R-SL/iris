# AI contribution: 50% or more AI-generated
[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=6.1,<6.2",
    "django-allauth[headless]>=65.19.7",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "jsonschema>=4.26,<5",
    "procrastinate[django]>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1,<6.2",
    "factory-boy>=3.3.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26,<5",
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "iris.settings.test"

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

# Django REST Framework does not ship type information.
# Keep this exception scoped to its package.
[[tool.mypy.overrides]]
module = ["rest_framework", "rest_framework.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "iris.settings.test"
testpaths = ["tests", "modules"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [".venv/*", "manage.py", "tests/*", "**/tests/*", "**/migrations/*"]

[tool.coverage.report]
# Team target: at least 70% total backend coverage (CI fails below it)
fail_under = 70
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = ["iris", "adapters", "modules"]
include_external_packages = true

# Contract 1: Adapters must not depend on the Django project.
[[tool.importlinter.contracts]]
name = "Adapters do not depend on the Django project package"
type = "forbidden"
source_modules = ["adapters"]
forbidden_modules = ["iris"]

# Contract 2: Django modules follow the approved dependency graph.
# Cross-module imports are permitted only through the services.py
# and queries.py interfaces of explicitly authorized modules.
[[tool.importlinter.contracts]]
name = "Modules communicate only through public services and queries"
type = "independence"
modules = [
    "modules.accounts",
    "modules.stores",
    "modules.categories",
    "modules.rules",
    "modules.households",
    "modules.documents",
    "modules.eligibility",
    "modules.listings",
    "modules.reservations",
    "modules.priority",
    "modules.review",
    "modules.audit",
    "modules.notifications",
    "modules.reporting",
    "modules.privacy",
]

# Shared infrastructure interfaces, available to every module.
ignore_imports = [
    # Cross-module test fixtures do not create a production module dependency.
    "modules.accounts.tests.test_accounts -> modules.stores.tests.factories",
    "modules.rules.tests.test_rule_set_versions -> modules.accounts.tests.factories",
    "modules.households.tests.** -> modules.accounts.tests.factories",
    "modules.households.tests.** -> modules.stores.tests.factories",
    "modules.stores.tests.test_admin -> modules.accounts.tests.factories",
    "modules.** -> modules.audit.services",
    "modules.** -> modules.audit.queries",
    "modules.** -> modules.rules.services",
    "modules.** -> modules.rules.queries",
    "modules.** -> modules.notifications.services",
    "modules.** -> modules.notifications.queries",

    # stores -> accounts
    "modules.stores.** -> modules.accounts.services",
    "modules.stores.** -> modules.accounts.queries",

    # households -> documents, eligibility, priority, review
    "modules.households.** -> modules.documents.services",
    "modules.households.** -> modules.documents.queries",
    "modules.households.** -> modules.eligibility.services",
    "modules.households.** -> modules.eligibility.queries",
    "modules.households.** -> modules.priority.services",
    "modules.households.** -> modules.priority.queries",
    "modules.households.** -> modules.review.services",
    "modules.households.** -> modules.review.queries",

    # eligibility -> households
    "modules.eligibility.** -> modules.households.services",
    "modules.eligibility.** -> modules.households.queries",

    # listings -> categories, stores, priority
    "modules.listings.** -> modules.categories.services",
    "modules.listings.** -> modules.categories.queries",
    "modules.listings.** -> modules.stores.services",
    "modules.listings.** -> modules.stores.queries",
    "modules.listings.** -> modules.priority.services",
    "modules.listings.** -> modules.priority.queries",

    # listings tests -> test setup only: the public services take model
    # instances, so building categories, stores and rule versions needs these.
    "modules.listings.tests.** -> modules.categories.models",
    "modules.listings.tests.** -> modules.categories.tests.factories",
    "modules.listings.tests.** -> modules.stores.models",
    "modules.listings.tests.** -> modules.stores.tests.factories",
    "modules.listings.tests.** -> modules.rules.models",
    "modules.listings.tests.** -> modules.rules.domain.schemas",

    # reservations -> listings, households, priority
    "modules.reservations.** -> modules.listings.services",
    "modules.reservations.** -> modules.listings.queries",
    "modules.reservations.** -> modules.households.services",
    "modules.reservations.** -> modules.households.queries",
    "modules.reservations.** -> modules.priority.services",
    "modules.reservations.** -> modules.priority.queries",

    # priority -> households, eligibility, review
    "modules.priority.** -> modules.households.services",
    "modules.priority.** -> modules.households.queries",
    "modules.priority.** -> modules.eligibility.services",
    "modules.priority.** -> modules.eligibility.queries",
    "modules.priority.** -> modules.review.services",
    "modules.priority.** -> modules.review.queries",

    # review -> households
    "modules.review.** -> modules.households.services",
    "modules.review.** -> modules.households.queries",

    # privacy -> accounts, households
    "modules.privacy.** -> modules.accounts.services",
    "modules.privacy.** -> modules.accounts.queries",
    "modules.privacy.** -> modules.households.services",
    "modules.privacy.** -> modules.households.queries",

    # reporting -> households, listings, reservations, stores
    "modules.reporting.** -> modules.households.services",
    "modules.reporting.** -> modules.households.queries",
    "modules.reporting.** -> modules.listings.services",
    "modules.reporting.** -> modules.listings.queries",
    "modules.reporting.** -> modules.reservations.services",
    "modules.reporting.** -> modules.reservations.queries",
    "modules.reporting.** -> modules.stores.services",
    "modules.reporting.** -> modules.stores.queries",
]

unmatched_ignore_imports_alerting = "none"

# Contract 3: Domain business rules must remain pure Python.
# Domain code must not depend on Django, HTTP frameworks,
# database models, service layers, or infrastructure.
[[tool.importlinter.contracts]]
name = "Domain logic has no framework or infrastructure dependencies"
type = "forbidden"
source_modules = ["modules.*.domain"]
forbidden_modules = [
    "django",
    "rest_framework",
    "drf_spectacular",
    "iris",
    "modules.*.api",
    "modules.*.models",
    "modules.*.services",
    "modules.*.queries",
    "modules.*.tasks",
]

[tool.ruff.lint]
# Windows Docker bind mounts may report Python files as executable.
ignore = ["EXE002"]
extend-select = [
  "DTZ",      # Rule 6: no naive datetimes (datetime.now() without tz, etc.)
  "TID251",   # Rules 6 and 9 + test rules: banned APIs listed below
  "PLR2004",  # Rule 2: magic numbers in comparisons (only kept for domain/, see below)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Rule 9: outside services only through adapters
"requests".msg = "Rule 9: call outside services through an adapter in adapters/."
"httpx".msg = "Rule 9: call outside services through an adapter in adapters/."
"urllib.request".msg = "Rule 9: call outside services through an adapter in adapters/."
"smtplib".msg = "Rule 9: send email through the email adapter."

# Rule 6: money is integer cents
"django.db.models.FloatField".msg = "Rule 6: money is integer cents. Use IntegerField/BigIntegerField (name it *_cents). For a non-money float, add '# noqa: TID251' with a reason."
"django.db.models.DecimalField".msg = "Rule 6: money is integer cents. Use IntegerField/BigIntegerField (name it *_cents). For a non-money decimal, add '# noqa: TID251' with a reason."

# Test rules: no fixed sleeps (use time-machine)
"time.sleep".msg = "No fixed sleeps. Freeze the clock with time-machine, or wait on an event/condition."

[tool.ruff.lint.per-file-ignores]
# Adapters are the one place allowed to call outside services (and back off with sleep)
"**/adapters/**" = ["TID251"]

# Magic-number check applies to domain/ only ("!" = every file NOT matching)
"!**/domain/**" = ["PLR2004"]

# Generated migrations contain Django's mutable class attributes and may contain
# naive datetime defaults and Decimal fields from the past.
"**/migrations/**" = ["DTZ", "RUF012", "TID251"]
