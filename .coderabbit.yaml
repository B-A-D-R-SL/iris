# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Iris is a public repo, so CodeRabbit's open-source tier applies (Team features):
# line-by-line reviews, code guidelines, path instructions and custom pre-merge checks.
# Deterministic rules (1, 6, 9, 10 and parts of 2, 4, 7) are enforced in CI instead;
# CodeRabbit focuses on the rules that need judgment.

language: en-US

reviews:
  profile: assertive
  high_level_summary: true
  poem: false

  # Turns failing pre-merge checks in "error" mode into a blocking "changes requested" review.
  request_changes_workflow: true

  path_instructions:
    - path: "backend/modules/*/domain/**/*.py"
      instructions: |
        Rule 2: thresholds, weights, fees and delays must come from the RuleSet, never
        literals or module constants. A changed rule needs a test whose "# rule:" comment
        names its BR- ID.
    - path: "backend/modules/*/services*.py"
      instructions: |
        Rule 3: flag read-modify-write on counters (read, change in Python, save);
        require filter().update(F(...)). New uniqueness must be a database constraint.
        Rule 5: flag logging, emailing or copying a SIN, income amounts, immigration
        status or document text.
    - path: "backend/modules/*/{api,views,serializers}*.py"
      instructions: |
        Rule 4: every endpoint checks role AND ownership (object-level), deny by default,
        with allowed and refused tests for each role in test_api.py.
    - path: "**/tests/**/*.py"
      instructions: |
        Test names state the rule. One test or more per acceptance criterion.
        Generated data only (factories); no real names, addresses or documents.
        Outside services use the fake adapters.
    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: |
        Rule 8: flag any eligibility or visibility decision; the API decides.
        Rule 7: all visible text uses translation keys with French and English entries.

  pre_merge_checks:
    # Checks on what the course rubric grades run in "error" mode (FIX-26): a failure blocks
    # through the request-changes workflow, and only a requested reviewer can override it.
    # Team-rule checks stay in "warning" until they stop producing false alarms.
    override_requested_reviewers_only: true
    # The PR policy workflow already enforces the title and the description sections.
    title:
      mode: "off"
    description:
      mode: "off"
    custom_checks:
      - name: "Sensitive data"            # rule 5; rubric 4.9 and 5.1
        mode: "error"
        instructions: |
          Fail if the PR logs, emails, or stores outside their own tables a SIN, income
          amounts, immigration status, or document text. Also fail if test data, fixtures
          or seed files contain realistic-looking real personal data (this repo is public).
      - name: "Role and ownership"        # rule 4; rubric 5.3
        mode: "error"
        instructions: |
          For every new or changed API endpoint, check that it enforces both role and
          ownership (object-level, not just "logged in"), and that test_api.py tests
          allowed and refused access for each role.
      - name: "RuleSet values"            # rule 2
        mode: "warning"
        instructions: |
          Fail if code under domain/ or services hard-codes a threshold, weight, fee or
          delay (as a literal or a module constant) instead of reading it from the RuleSet.
          Fail if a business rule changes without a test whose "# rule:" comment names
          its BR- ID.
      - name: "Counters and uniqueness"   # rule 3
        mode: "warning"
        instructions: |
          Fail if a counter or quantity is read, changed in Python and saved back
          (read-modify-write). It must use filter().update(F(...)). Fail if new
          uniqueness is enforced only in Python instead of a database constraint.
      - name: "Front end decides nothing" # rule 8
        mode: "warning"
        instructions: |
          Fail if TypeScript or TSX code decides eligibility, approval, priority or what a
          user may see, instead of rendering what the API returned.
      - name: "Error and edge tests"      # rubric 2
        mode: "error"
        instructions: |
          Pass if the PR changes no application code under backend/ or frontend/src/
          (tests, migrations, documentation and configuration do not count).
          Otherwise fail unless the PR adds or changes at least one test that exercises the
          changed behaviour with an invalid input, a boundary value, a failing dependency or
          a refused permission, and asserts the expected outcome (status code, error message,
          raised exception or unchanged data). Name the changed behaviour that has no such test.
      - name: "Meaningful tests"          # rubric 2
        mode: "error"
        instructions: |
          Pass if the PR adds or changes no test. Fail if an added or changed test: has no
          assertion; only asserts a constant or a literal against itself; only checks that a
          value is not None or truthy where a specific value should be checked; is empty,
          skipped or a placeholder (for example a test file holding only comments); repeats
          another test's case; or mocks the code it claims to test. Name each such test.
      - name: "Size and complexity"       # rubric 3.1 to 3.3
        mode: "error"
        instructions: |
          Look at the functions, methods and React components the PR adds or changes, and the
          files it adds or changes, ignoring generated files, migrations and lock files.
          Fail if a function, method or component is longer than 50 lines or has a cyclomatic
          complexity above 15, or if a file is longer than 500 lines. A case passes when a
          comment next to it gives a specific technical reason for exceeding the limit;
          "too hard to refactor" or "generated by AI" is not a reason. Name each failing
          function or file with its line count or complexity.
      - name: "No placeholders"           # rubric 3.8
        mode: "error"
        instructions: |
          Fail if the PR adds: a TODO or FIXME for functionality its linked issue requires; a
          NotImplementedError, an empty function or a placeholder return value standing in
          for required behaviour; a source file holding only a docstring or comments; a
          commented-out block of 5 or more lines of code; or a function, component or file
          that nothing in the repository uses.
      - name: "Errors and logging"        # rubric 4
        mode: "error"
        instructions: |
          Fail if added or changed code: has an empty except or catch block, or one that
          drops the error without logging it or raising again; calls storage, email, HTTP or
          another outside service without handling its failure; shows exception messages,
          stack traces or internal configuration to users; logs with print() or console.*
          instead of the project logger (backend: logging with an "event" in extra; frontend:
          src/shared/logger.ts); logs names, emails, addresses, incomes, document text or
          tokens; or adds an important state change (create, approve, publish, delete,
          sign-in) that writes no log event.
      - name: "AI declaration consistency" # rubric 8
        mode: "error"
        instructions: |
          Compare the "AI contribution" section of the PR description with the changed files,
          ignoring generated files, migrations and lock files. Fail if: a source file the PR
          adds has no AI contribution line (one of "No substantial AI-generated code",
          "Below 50% AI-generated", "50% or more AI-generated") in its first lines; a file
          listed under "AI-assisted files" is not changed by the PR; the description says
          "No substantial AI-generated code" while a file the PR adds declares an
          AI-generated level; or a file listed as AI-assisted declares "No substantial
          AI-generated code" in its header.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "docs/05-process/review-rules.md"
        applyTo: "backend/**, frontend/**"
