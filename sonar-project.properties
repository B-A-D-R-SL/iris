# AI contribution: 50% or more AI-generated
# SonarQube Cloud project identity is supplied by GitHub Actions:
# - sonar.organization=${{ vars.SONAR_ORGANIZATION }}
# - sonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

sonar.projectName=Iris
sonar.sourceEncoding=UTF-8

# Analyze the repository, including tools, GitHub workflows and frontend config.
# Test inclusions keep test files separate from production-source metrics.
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/node_modules/**,**/dist/**,**/coverage/**,backend/tests/**,backend/modules/**/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,frontend/scripts/**/*.test.mjs,tools/**/tests/**
sonar.test.inclusions=backend/tests/**/*.py,backend/modules/**/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**/*.ts,frontend/scripts/**/*.test.mjs,tools/**/tests/**/*.py

sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Tools are analyzed, but CI exports coverage only for backend and frontend.
sonar.coverage.exclusions=backend/manage.py,backend/**/migrations/**,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/scripts/**/*.test.mjs,tools/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
