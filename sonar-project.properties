# SonarQube Cloud project identity is supplied by GitHub Actions:
# - sonar.organization=${{ vars.SONAR_ORGANIZATION }}
# - sonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

sonar.projectName=Iris
sonar.sourceEncoding=UTF-8

sonar.sources=backend/adapters,backend/iris,backend/manage.py,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**/*.ts

sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.coverage.exclusions=backend/manage.py,backend/iris/asgi.py,backend/iris/settings/**,backend/iris/wsgi.py,frontend/src/main.tsx,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
