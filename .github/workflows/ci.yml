# AI contribution: 50% or more AI-generated
# SET-02 (#378). The job names "backend" and "frontend" are meant to be the required
# status checks of the main ruleset (#381): rename them there too if they change here.
# Actions are pinned to full commit SHAs; the comment gives the release.
name: CI

on:
  # Every pull request, whatever its target (task -> US, US -> ES, ES -> main)
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iris
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # CI-only values; nothing here is a real secret.
      DJANGO_SECRET_KEY: iris-ci-only-not-a-secret
      DATABASE_URL: postgresql://iris:iris_ci_password@localhost:5432/iris
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Pull-request code runs in this job: do not leave the token in .git/config.
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Install exactly what uv.lock says, from wheels only (no setup scripts run),
      # then call the tools from that environment so nothing is resolved again.
      - name: Install dependencies
        run: |
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Module boundaries (import-linter)
        run: lint-imports

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with coverage (minimum 70%)
        run: pytest --cov --cov-report=term

      - name: Dependency audit (pip-audit)
        run: pip-audit --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Pull-request code runs in this job: do not leave the token in .git/config.
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Tests with coverage (Vitest)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Dependency audit (high and critical fail)
        run: pnpm audit --prod --audit-level high
