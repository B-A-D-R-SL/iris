# AI contribution: 50% or more AI-generated
# SET-02 (#378). The job names "backend" and "frontend" are the required status
# checks in the main ruleset: rename them there too if they ever change here.
name: CI

on:
  # Every pull request, whatever its target (task -> US, US -> ES, ES -> main)
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iris
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # CI-only values; nothing here is a real secret.
      DJANGO_SECRET_KEY: iris-ci-only-not-a-secret
      DATABASE_URL: postgresql://iris:iris_ci_password@localhost:5432/iris
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Module boundaries (import-linter)
        run: uv run lint-imports

      - name: Missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests with coverage (minimum 70%)
        run: uv run pytest --cov --cov-report=term

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Tests with coverage (Vitest)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Dependency audit (high and critical fail)
        run: pnpm audit --prod --audit-level high
