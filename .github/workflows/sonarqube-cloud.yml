name: SonarQube Cloud

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarqube-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Coverage and scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: iris
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://iris@127.0.0.1:5432/iris
      DJANGO_SECRET_KEY: iris-ci-secret-key-for-tests
      DJANGO_SETTINGS_MODULE: iris.settings.test
      NODE_VERSION: "24"
      PNPM_VERSION: "12.10.1"
      PYTHON_VERSION: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          working-directory: backend

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --group dev --python "${PYTHON_VERSION}"

      - name: Run backend tests with coverage
        env:
          PYTHONPATH: backend
        run: >-
          uv run --project backend --python "${PYTHON_VERSION}"
          pytest backend/tests
          --cov=backend/iris
          --cov=backend/adapters
          --cov-config=.coveragerc
          --cov-report=xml:backend/coverage.xml
          --cov-report=term-missing

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: pnpm test:coverage

      - name: Validate SonarQube Cloud configuration
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          missing=0
          if [ -z "${SONAR_ORGANIZATION}" ]; then
            echo "::error::Set the SONAR_ORGANIZATION repository variable to the SonarQube Cloud organization key."
            missing=1
          fi
          if [ -z "${SONAR_PROJECT_KEY}" ]; then
            echo "::error::Set the SONAR_PROJECT_KEY repository variable to the SonarQube Cloud project key."
            missing=1
          fi
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::Set the SONAR_TOKEN repository secret to a SonarQube Cloud token."
            missing=1
          fi
          exit "${missing}"

      - name: Run SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
