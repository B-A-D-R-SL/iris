# AI contribution: 50% or more AI-generated
# FIX-25 (#616). Audits every locked project for known vulnerabilities:
# - python: pip-audit on each uv project, the tools/ ones included, from its uv.lock.
# - frontend: pnpm audit on all frontend dependencies, development ones included. The team
#   chose to audit them here (FIX-25); the required frontend job in ci.yml still audits only
#   production dependencies, so a development-only advisory does not block every merge.
#
# A new advisory can make an unchanged lock file vulnerable, so this also runs weekly.
# It is not a required check: a failure shows on the pull request and in the Actions tab.
# Actions are pinned to full commit SHAs; the comment gives the release.
# .github/scripts/test_dependency_coverage.py fails when a locked project is missing here.
name: Dependency audit

on:
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "tools/*/pyproject.toml"
      - "tools/*/uv.lock"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "tools/*/pyproject.toml"
      - "tools/*/uv.lock"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    # Mondays at 10:00 UTC, early morning in Montréal.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  # Only a newer push to the same pull request cancels a run; a push to main must not
  # cancel the weekly scheduled audit, which shares its group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: pip-audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every project, not only the first one that fails.
      fail-fast: false
      matrix:
        project:
          - backend
          - tools/mock_notices
          - tools/notice_reading_spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # pip-audit comes from the backend's development group, so its version and its own
      # dependencies are the ones uv.lock pins. Wheels only: no setup scripts run.
      - name: Install pip-audit
        run: uv sync --project backend --locked --no-build --only-group dev

      # The exported list is fully pinned and hashed, so pip-audit does not resolve
      # anything itself (--disable-pip). --locked fails if uv.lock is out of date.
      - name: Export the locked requirements
        env:
          PROJECT: ${{ matrix.project }}
        run: >
          uv export --project "$PROJECT" --locked --all-groups --no-emit-project
          --format requirements-txt --quiet --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Dependency audit (pip-audit)
        run: >
          backend/.venv/bin/pip-audit --strict --disable-pip --require-hashes
          --requirement "$RUNNER_TEMP/requirements.txt"

  frontend:
    name: pnpm audit (frontend, all dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # Avoid pnpm cache restore: the repository cache hit exceeded the account egress limit.
          package-manager-cache: false

      # pnpm audit reads pnpm-lock.yaml; nothing needs installing.
      - name: Dependency audit, development included (high and critical fail)
        run: pnpm audit --audit-level high
