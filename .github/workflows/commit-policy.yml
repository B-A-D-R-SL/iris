# AI contribution: 50% or more AI-generated
# I have drafted a plan, told AI to implement it, and reviewed the code
# The tracked .githooks/ files are available after merging into main, but Git
# does not enable them in a fresh clone. Developers must run the one-time
# `git config --local core.hooksPath .githooks` command from the README.
# Once enabled in a clone, the hooks keep working on branches created there.
# This check uses the base branch's workflow and hook. It fetches Git objects
# without checking out PR files and never runs a hook supplied by the PR.
# The first PR introducing this workflow needs human review;
# later PRs can be checked after this workflow reaches the base branch.
# Repository admins must require this check to block noncompliant merges and
# allow pull_request_target in the Actions event policy for this public repo.

name: Commit policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  commit-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR commit subjects with the base branch hook
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read Git objects only. No pull-request files are checked out.
          git init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "refs/heads/$BASE_REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            echo "::error::Base branch changed while validating; rerun the check"
            exit 1
          fi
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::PR head changed while validating; rerun the check"
            exit 1
          fi

          validator=$(mktemp)
          message_file=$(mktemp)
          commit_list=$(mktemp)
          trap 'rm -f "$validator" "$message_file" "$commit_list"' EXIT
          git show "$BASE_SHA:.githooks/commit-msg" > "$validator"
          chmod +x "$validator"
          git rev-list --reverse --no-merges "$BASE_SHA..$HEAD_SHA" > "$commit_list"

          while IFS= read -r commit; do
            git show -s --format=%B "$commit" > "$message_file"
            if ! "$validator" "$message_file"; then
              echo "::error::Commit $commit has an invalid subject"
              exit 1
            fi
          done < "$commit_list"
