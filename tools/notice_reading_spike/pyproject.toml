# AI contribution: 50% or more AI-generated
[project]
name = "notice-reading-spike"
version = "0.1.0"
description = "Benchmark harness comparing document readers on the mock Revenu Québec notices (SET-19)"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "google-auth>=2.62.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",  # runtime need of pypdfium2's to_pil(); nothing imports it directly
    "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15
